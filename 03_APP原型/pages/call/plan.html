<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>点名任务 - 执勤干警APP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #1a5276; }
        * { font-family: 'Noto Sans SC', -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #f1f5f9; }

        .nav-header { background: linear-gradient(145deg, #1a5276 0%, #2874a6 100%); }

        .filter-tag {
            border: 1.5px solid #e2e8f0;
            transition: all 0.2s;
        }
        .filter-tag.active {
            border-color: var(--primary);
            background: rgba(26,82,118,0.08);
            color: var(--primary);
        }

        .task-card { transition: all 0.2s; background: #fff; }
        .task-card:active { transform: scale(0.98); }
    </style>
</head>
<body>
    <!-- 顶部导航 -->
    <div class="nav-header text-white px-4 py-3 flex items-center justify-between sticky top-0 z-30">
        <a href="../../home.html" class="text-white"><i class="fas fa-arrow-left text-lg"></i></a>
        <h1 class="text-base font-semibold">点名任务</h1>
        <button onclick="showCreate()" class="text-white/80"><i class="fas fa-plus text-lg"></i></button>
    </div>

    <!-- Tab筛选 -->
    <div class="bg-white px-4 pt-3 pb-2 border-b border-gray-100">
        <div class="flex gap-2 overflow-x-auto">
            <button onclick="switchTab(this, 'all')" class="filter-tag active flex-shrink-0 px-4 py-2 text-xs rounded-full text-gray-600">全部</button>
            <button onclick="switchTab(this, 'running')" class="filter-tag flex-shrink-0 px-4 py-2 text-xs rounded-full text-gray-600">进行中</button>
            <button onclick="switchTab(this, 'done')" class="filter-tag flex-shrink-0 px-4 py-2 text-xs rounded-full text-gray-600">已完成</button>
        </div>
    </div>

    <div class="p-3 space-y-2">
        <!-- 进行中任务 -->
        <a href="task.html" class="task-card block rounded-xl p-3 border-l-4 border-blue-600 shadow-sm">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-blue-50 flex items-center justify-center flex-shrink-0">
                    <i class="fas fa-clock text-blue-600 text-lg"></i>
                </div>
                <div class="flex-1 min-w-0">
                    <div class="flex items-center justify-between">
                        <h2 class="text-sm font-semibold text-gray-800 truncate">1-2监区 - 晚间点名</h2>
                        <span class="text-xs bg-blue-600 text-white px-2 py-0.5 rounded-full flex-shrink-0 ml-2">进行中</span>
                    </div>
                    <div class="flex items-center justify-between mt-1">
                        <span class="text-xs text-gray-400">21:00</span>
                        <div class="flex gap-2 text-xs">
                            <span class="text-green-600">已点182</span>
                            <span class="text-orange-500">未点4</span>
                        </div>
                    </div>
                </div>
                <i class="fas fa-chevron-right text-gray-300 text-xs"></i>
            </div>
        </a>

        <a href="#" class="task-card block rounded-xl p-3 border-l-4 border-blue-600 shadow-sm">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-blue-50 flex items-center justify-center flex-shrink-0">
                    <i class="fas fa-clock text-blue-600 text-lg"></i>
                </div>
                <div class="flex-1 min-w-0">
                    <div class="flex items-center justify-between">
                        <h2 class="text-sm font-semibold text-gray-800 truncate">3监区 - 晚间点名</h2>
                        <span class="text-xs bg-gray-100 text-gray-600 px-2 py-0.5 rounded-full flex-shrink-0 ml-2">待签到</span>
                    </div>
                    <div class="flex items-center justify-between mt-1">
                        <span class="text-xs text-gray-400">21:30</span>
                        <div class="flex gap-2 text-xs">
                            <span class="text-gray-400">应点156</span>
                        </div>
                    </div>
                </div>
                <i class="fas fa-chevron-right text-gray-300 text-xs"></i>
            </div>
        </a>

        <!-- 已完成 -->
        <a href="result.html" class="task-card block rounded-xl p-3 border-l-4 border-green-500 shadow-sm opacity-70">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-green-50 flex items-center justify-center flex-shrink-0">
                    <i class="fas fa-check text-green-500 text-lg"></i>
                </div>
                <div class="flex-1 min-w-0">
                    <div class="flex items-center justify-between">
                        <h2 class="text-sm font-semibold text-gray-600 truncate">严管区 - 晚间点名</h2>
                        <span class="text-xs bg-green-100 text-green-600 px-2 py-0.5 rounded-full flex-shrink-0 ml-2">已完成</span>
                    </div>
                    <div class="flex items-center justify-between mt-1">
                        <span class="text-xs text-gray-400">05-20 21:00</span>
                        <div class="flex gap-2 text-xs">
                            <span class="text-green-600">86/86</span>
                        </div>
                    </div>
                </div>
                <i class="fas fa-chevron-right text-gray-300 text-xs"></i>
            </div>
        </a>

        <a href="result.html" class="task-card block rounded-xl p-3 border-l-4 border-green-500 shadow-sm opacity-70">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-green-50 flex items-center justify-center flex-shrink-0">
                    <i class="fas fa-check text-green-500 text-lg"></i>
                </div>
                <div class="flex-1 min-w-0">
                    <div class="flex items-center justify-between">
                        <h2 class="text-sm font-semibold text-gray-600 truncate">1-1监区 - 午休点名</h2>
                        <span class="text-xs bg-green-100 text-green-600 px-2 py-0.5 rounded-full flex-shrink-0 ml-2">已完成</span>
                    </div>
                    <div class="flex items-center justify-between mt-1">
                        <span class="text-xs text-gray-400">05-20 12:00</span>
                        <div class="flex gap-2 text-xs">
                            <span class="text-green-600">179/179</span>
                        </div>
                    </div>
                </div>
                <i class="fas fa-chevron-right text-gray-300 text-xs"></i>
            </div>
        </a>
    </div>

    <!-- 创建计划弹窗 -->
    <div id="createModal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-end">
        <div class="bg-white w-full rounded-t-3xl p-5 pb-6 max-h-[70vh] overflow-y-auto">
            <div class="w-10 h-1 bg-gray-300 rounded-full mx-auto mb-4"></div>
            <h3 class="text-base font-semibold text-gray-800 mb-4">创建点名计划</h3>
            <div class="space-y-3">
                <div>
                    <label class="text-xs text-gray-500 mb-1.5 block">点名范围</label>
                    <select class="w-full px-3 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm">
                        <option>全监</option>
                        <option>1-2监区</option>
                        <option>3监区</option>
                    </select>
                </div>
                <div>
                    <label class="text-xs text-gray-500 mb-1.5 block">点名时间</label>
                    <input type="datetime-local" class="w-full px-3 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm" value="2026-05-21T21:00">
                </div>
                <div>
                    <label class="text-xs text-gray-500 mb-1.5 block">点名方式</label>
                    <div class="grid grid-cols-3 gap-2">
                        <button class="py-2 text-xs bg-blue-600 text-white rounded-lg">全员</button>
                        <button class="py-2 text-xs bg-gray-100 text-gray-600 rounded-lg">按组</button>
                        <button class="py-2 text-xs bg-gray-100 text-gray-600 rounded-lg">按标签</button>
                    </div>
                </div>
                <button onclick="hideCreate()" class="w-full bg-blue-600 text-white rounded-xl py-3 text-sm font-medium">创建计划</button>
                <button onclick="hideCreate()" class="w-full text-gray-500 py-2 text-sm text-center">取消</button>
            </div>
        </div>
    </div>

    <script>
        function switchTab(btn, type) {
            document.querySelectorAll('.filter-tag').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function showCreate() {
            document.getElementById('createModal').classList.remove('hidden');
        }
        function hideCreate() {
            document.getElementById('createModal').classList.add('hidden');
        }
    </script>
</body>
</html>
