<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>点名结果 - 执勤干警APP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #1a5276; --primary-light: #2874a6; }
        * { font-family: 'Noto Sans SC', -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #f1f5f9; }

        .nav-header { background: linear-gradient(145deg, #1a5276 0%, #2874a6 100%); }

        .app-card { background: #fff; border: 1px solid rgba(226,232,240,0.8); box-shadow: 0 2px 8px -2px rgba(0,0,0,0.06); }

        .progress-bar { background: #e2e8f0; border-radius: 999px; overflow: hidden; }
        .progress-fill { background: linear-gradient(90deg, #22c55e, #16a34a); border-radius: 999px; transition: width 0.5s ease; }

        .stat-item { transition: all 0.2s; }
        .tab-btn { transition: all 0.2s; }
        .tab-btn.active { color: var(--primary); border-color: var(--primary); background: rgba(26,82,118,0.08); }

        .person-item { transition: all 0.2s; }
        .person-item:active { background: #f1f5f9; }

        .action-btn { transition: all 0.2s; }
        .action-btn:active { transform: scale(0.98); }

        .modal-card { background: #fff; border-radius: 24px 24px 0 0; }

        .safe-area-bottom { padding-bottom: env(safe-area-inset-bottom, 0px); }
    </style>
</head>
<body>
    <!-- 顶部导航 -->
    <div class="nav-header text-white px-4 py-3 flex items-center justify-between sticky top-0 z-30">
        <a href="plan.html" class="text-white"><i class="fas fa-arrow-left text-lg"></i></a>
        <h1 class="text-base font-semibold">点名结果</h1>
        <button class="text-white/80"><i class="fas fa-share-alt text-lg"></i></button>
    </div>

    <div class="p-4 space-y-4">
        <!-- 汇总卡片 -->
        <div class="app-card rounded-2xl p-4">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-sm font-bold text-gray-800">1-2监区 · 晚间点名</h2>
                <span class="text-xs bg-green-100 text-green-600 px-2 py-1 rounded-full">已完成</span>
            </div>
            <div class="grid grid-cols-4 gap-2">
                <div class="stat-item text-center p-2.5 bg-blue-50 rounded-xl">
                    <p class="text-xl font-bold text-blue-600">189</p>
                    <p class="text-xs text-gray-500">应点</p>
                </div>
                <div class="stat-item text-center p-2.5 bg-green-50 rounded-xl">
                    <p class="text-xl font-bold text-green-600">182</p>
                    <p class="text-xs text-gray-500">已点</p>
                </div>
                <div class="stat-item text-center p-2.5 bg-red-50 rounded-xl">
                    <p class="text-xl font-bold text-red-500">4</p>
                    <p class="text-xs text-gray-500">未点</p>
                </div>
                <div class="stat-item text-center p-2.5 bg-yellow-50 rounded-xl">
                    <p class="text-xl font-bold text-yellow-500">3</p>
                    <p class="text-xs text-gray-500">流动中</p>
                </div>
            </div>
            <div class="mt-4 flex items-center justify-between">
                <div class="text-xs text-gray-400">
                    <span><i class="fas fa-clock mr-1"></i>完成: 21:28</span>
                    <span class="ml-3"><i class="fas fa-user mr-1"></i>执行: 张警官</span>
                </div>
                <span class="text-lg font-bold text-green-600">96.3%</span>
            </div>
            <div class="mt-3 w-full h-2 progress-bar">
                <div class="h-full progress-fill" style="width: 96.3%"></div>
            </div>
        </div>

        <!-- 筛选 -->
        <div class="flex gap-2 overflow-x-auto pb-1">
            <button onclick="filterList(this)" class="tab-btn active flex-shrink-0 px-4 py-1.5 text-xs rounded-full border-2 border-gray-200 text-gray-600">全部 (189)</button>
            <button onclick="filterList(this)" class="tab-btn flex-shrink-0 px-4 py-1.5 text-xs rounded-full border-2 border-gray-200 text-gray-600">已点 (182)</button>
            <button onclick="filterList(this)" class="tab-btn flex-shrink-0 px-4 py-1.5 text-xs rounded-full border-2 border-gray-200 text-gray-600">未点 (4)</button>
            <button onclick="filterList(this)" class="tab-btn flex-shrink-0 px-4 py-1.5 text-xs rounded-full border-2 border-gray-200 text-gray-600">流动中 (3)</button>
        </div>

        <!-- 未点人员 -->
        <div class="bg-red-50 border border-red-200 rounded-2xl p-4">
            <div class="flex items-center gap-2 mb-3">
                <i class="fas fa-exclamation-circle text-red-500"></i>
                <h3 class="text-sm font-semibold text-red-700">未点人员</h3>
            </div>
            <div class="space-y-2">
                <div class="person-item flex items-center gap-3 p-2.5 bg-white rounded-xl">
                    <div class="w-10 h-10 rounded-xl bg-gray-200 flex items-center justify-center text-gray-400"><i class="fas fa-user text-sm"></i></div>
                    <div class="flex-1">
                        <p class="text-sm text-gray-800">周某某</p>
                        <p class="text-xs text-gray-400">430100-0156 · 外出就医</p>
                    </div>
                    <span class="text-xs bg-yellow-100 text-yellow-600 px-2 py-1 rounded-full">已知原因</span>
                </div>
                <div class="person-item flex items-center gap-3 p-2.5 bg-white rounded-xl">
                    <div class="w-10 h-10 rounded-xl bg-gray-200 flex items-center justify-center text-gray-400"><i class="fas fa-user text-sm"></i></div>
                    <div class="flex-1">
                        <p class="text-sm text-gray-800">钱某某</p>
                        <p class="text-xs text-gray-400">430100-0178 · 待核查</p>
                    </div>
                    <button onclick="showVerifyModal('钱某某', '430100-0178')" class="action-btn text-xs bg-red-100 text-red-600 px-3 py-1.5 rounded-full">待核查</button>
                </div>
                <div class="person-item flex items-center gap-3 p-2.5 bg-white rounded-xl">
                    <div class="w-10 h-10 rounded-xl bg-gray-200 flex items-center justify-center text-gray-400"><i class="fas fa-user text-sm"></i></div>
                    <div class="flex-1">
                        <p class="text-sm text-gray-800">孙某某</p>
                        <p class="text-xs text-gray-400">430100-0203 · 待核查</p>
                    </div>
                    <button onclick="showVerifyModal('钱某某', '430100-0178')" class="action-btn text-xs bg-red-100 text-red-600 px-3 py-1.5 rounded-full">待核查</button>
                </div>
                <div class="person-item flex items-center gap-3 p-2.5 bg-white rounded-xl">
                    <div class="w-10 h-10 rounded-xl bg-gray-200 flex items-center justify-center text-gray-400"><i class="fas fa-user text-sm"></i></div>
                    <div class="flex-1">
                        <p class="text-sm text-gray-800">吴某某</p>
                        <p class="text-xs text-gray-400">430100-0215 · 待核查</p>
                    </div>
                    <button onclick="showVerifyModal('钱某某', '430100-0178')" class="action-btn text-xs bg-red-100 text-red-600 px-3 py-1.5 rounded-full">待核查</button>
                </div>
            </div>
        </div>

        <!-- 点名明细 -->
        <div class="app-card rounded-2xl p-4">
            <h3 class="text-sm font-semibold text-gray-800 mb-3">点名明细</h3>
            <div class="space-y-2">
                <div class="person-item flex items-center gap-3 p-2.5 rounded-xl">
                    <div class="w-10 h-10 rounded-xl bg-gray-200 flex items-center justify-center text-gray-400"><i class="fas fa-user"></i></div>
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center gap-1.5">
                            <span class="text-sm text-gray-800">张某某</span>
                            <i class="fas fa-check-circle text-green-500 text-xs"></i>
                        </div>
                        <p class="text-xs text-gray-400">430100-0105 · 21:01</p>
                    </div>
                </div>
                <div class="person-item flex items-center gap-3 p-2.5 rounded-xl">
                    <div class="w-10 h-10 rounded-xl bg-gray-200 flex items-center justify-center text-gray-400"><i class="fas fa-user"></i></div>
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center gap-1.5">
                            <span class="text-sm text-gray-800">刘某某</span>
                            <i class="fas fa-check-circle text-green-500 text-xs"></i>
                        </div>
                        <p class="text-xs text-gray-400">430100-0112 · 21:01</p>
                    </div>
                </div>
                <div class="person-item flex items-center gap-3 p-2.5 rounded-xl">
                    <div class="w-10 h-10 rounded-xl bg-gray-200 flex items-center justify-center text-gray-400"><i class="fas fa-user"></i></div>
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center gap-1.5">
                            <span class="text-sm text-gray-800">陈某某</span>
                            <i class="fas fa-walking text-yellow-500 text-xs"></i>
                        </div>
                        <p class="text-xs text-gray-400">430100-0089 · 流动中</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="h-4"></div>
    </div>

    <!-- 核查弹窗 -->
    <div id="verifyModal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-end">
        <div class="modal-card w-full p-6 pb-8">
            <div class="w-12 h-1 bg-gray-300 rounded-full mx-auto mb-5"></div>
            <h3 class="text-base font-semibold text-gray-800 mb-2">核查登记</h3>
            <p id="verifyName" class="text-sm text-gray-600 mb-4"></p>
            <div class="space-y-3">
                <div>
                    <label class="text-sm text-gray-600 mb-2 block">核查结果</label>
                    <select id="verifyResult" class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm outline-none bg-gray-50">
                        <option>已找到，在监区</option>
                        <option>外出就医，已办理手续</option>
                        <option>转区域流动中</option>
                        <option>系统误判</option>
                    </select>
                </div>
                <div>
                    <label class="text-sm text-gray-600 mb-2 block">补充说明</label>
                    <textarea id="verifyNote" class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm outline-none bg-gray-50 resize-none" rows="2" placeholder="可选填写"></textarea>
                </div>
                <button onclick="submitVerify()" class="action-btn w-full bg-blue-600 text-white rounded-xl py-3.5 text-sm font-medium">确认核查</button>
                <button onclick="hideVerifyModal()" class="w-full text-gray-500 py-3 text-sm">取消</button>
            </div>
        </div>
    </div>

    <script>
        function filterList(btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function showVerifyModal(name, id) {
            document.getElementById('verifyName').textContent = name + ' · ' + id;
            document.getElementById('verifyModal').classList.remove('hidden');
        }

        function hideVerifyModal() {
            document.getElementById('verifyModal').classList.add('hidden');
        }

        function submitVerify() {
            alert('核查登记已提交');
            hideVerifyModal();
        }
    </script>
</body>
</html>
