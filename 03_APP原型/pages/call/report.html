<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>点名报告 - 执勤干警APP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #1a5276; --primary-light: #2874a6; }
        * { font-family: 'Noto Sans SC', -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #f1f5f9; }

        .nav-header { background: linear-gradient(145deg, #1a5276 0%, #2874a6 100%); }

        .app-card { background: #fff; border: 1px solid rgba(226,232,240,0.8); box-shadow: 0 2px 8px -2px rgba(0,0,0,0.06); }

        .progress-bar { background: #e2e8f0; border-radius: 999px; overflow: hidden; }
        .progress-fill { background: linear-gradient(90deg, #22c55e, #16a34a); border-radius: 999px; transition: width 0.5s ease; }

        .zone-item { transition: all 0.2s; }
        .zone-item:active { background: #f8fafc; }

        .stat-item { transition: all 0.2s; }

        .action-btn { transition: all 0.2s; }
        .action-btn:active { transform: scale(0.98); }

        .safe-area-bottom { padding-bottom: env(safe-area-inset-bottom, 0px); }
    </style>
</head>
<body>
    <!-- 顶部导航 -->
    <div class="nav-header text-white px-4 py-3 flex items-center justify-between sticky top-0 z-30">
        <a href="plan.html" class="text-white"><i class="fas fa-arrow-left text-lg"></i></a>
        <h1 class="text-base font-semibold">点名报告</h1>
        <button class="text-white/80"><i class="fas fa-download text-lg"></i></button>
    </div>

    <div class="p-4 space-y-4">
        <!-- 日期筛选 -->
        <div class="app-card rounded-xl p-3 flex items-center gap-3">
            <button class="text-gray-400"><i class="fas fa-chevron-left"></i></button>
            <div class="flex-1 text-center">
                <span class="text-sm font-medium text-gray-800">2026年5月21日</span>
            </div>
            <button class="text-gray-400"><i class="fas fa-chevron-right"></i></button>
        </div>

        <!-- 全监汇总 -->
        <div class="app-card rounded-2xl p-4">
            <h3 class="text-sm font-semibold text-gray-800 mb-4">全监汇总</h3>
            <div class="grid grid-cols-4 gap-2 mb-4">
                <div class="stat-item text-center p-2.5 bg-blue-50 rounded-xl">
                    <p class="text-lg font-bold text-blue-600">1,286</p>
                    <p class="text-xs text-gray-500">应点</p>
                </div>
                <div class="stat-item text-center p-2.5 bg-green-50 rounded-xl">
                    <p class="text-lg font-bold text-green-600">1,268</p>
                    <p class="text-xs text-gray-500">已点</p>
                </div>
                <div class="stat-item text-center p-2.5 bg-red-50 rounded-xl">
                    <p class="text-lg font-bold text-red-500">12</p>
                    <p class="text-xs text-gray-500">未点</p>
                </div>
                <div class="stat-item text-center p-2.5 bg-yellow-50 rounded-xl">
                    <p class="text-lg font-bold text-yellow-500">6</p>
                    <p class="text-xs text-gray-500">流动中</p>
                </div>
            </div>
            <div class="w-full h-2 progress-bar">
                <div class="h-full progress-fill" style="width: 98.6%"></div>
            </div>
            <p class="text-xs text-gray-500 mt-2 text-right">完成率 98.6%</p>
        </div>

        <!-- 各监区明细 -->
        <div class="app-card rounded-2xl p-4">
            <h3 class="text-sm font-semibold text-gray-800 mb-4">各监区明细</h3>
            <div class="space-y-2">
                <div class="zone-item flex items-center gap-3 p-3 bg-green-50 rounded-xl">
                    <div class="flex-1">
                        <p class="text-sm font-medium text-gray-800">1-2监区</p>
                        <p class="text-xs text-gray-500">182/189 · 96.3%</p>
                    </div>
                    <span class="text-xs text-green-600 font-medium">已完成</span>
                </div>
                <div class="zone-item flex items-center gap-3 p-3 bg-green-50 rounded-xl">
                    <div class="flex-1">
                        <p class="text-sm font-medium text-gray-800">3监区</p>
                        <p class="text-xs text-gray-500">156/158 · 98.7%</p>
                    </div>
                    <span class="text-xs text-green-600 font-medium">已完成</span>
                </div>
                <div class="zone-item flex items-center gap-3 p-3 bg-green-50 rounded-xl">
                    <div class="flex-1">
                        <p class="text-sm font-medium text-gray-800">4监区</p>
                        <p class="text-xs text-gray-500">165/165 · 100%</p>
                    </div>
                    <span class="text-xs text-green-600 font-medium">已完成</span>
                </div>
                <div class="zone-item flex items-center gap-3 p-3 bg-blue-50 rounded-xl">
                    <div class="flex-1">
                        <p class="text-sm font-medium text-gray-800">5监区</p>
                        <p class="text-xs text-gray-500">120/142 · 84.5%</p>
                    </div>
                    <span class="text-xs text-blue-600 font-medium">进行中</span>
                </div>
                <div class="zone-item flex items-center gap-3 p-3 bg-gray-50 rounded-xl">
                    <div class="flex-1">
                        <p class="text-sm font-medium text-gray-500">6监区</p>
                        <p class="text-xs text-gray-400">0/156 · 0%</p>
                    </div>
                    <span class="text-xs text-gray-400 font-medium">未开始</span>
                </div>
            </div>
        </div>

        <div class="h-4"></div>
    </div>
</body>
</html>
