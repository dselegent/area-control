<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>流动申请 - 执勤干警APP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #1a5276; --primary-light: #2874a6; }
        * { font-family: 'Noto Sans SC', -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #f1f5f9; }

        .nav-header { background: linear-gradient(145deg, #1a5276 0%, #2874a6 100%); }

        .app-card { background: #fff; border: 1px solid rgba(226,232,240,0.8); box-shadow: 0 2px 8px -2px rgba(0,0,0,0.06); }

        .type-btn { border: 2px solid #e2e8f0; transition: all 0.2s; }
        .type-btn.active { border-color: var(--primary); background: rgba(26,82,118,0.08); color: var(--primary); }

        .time-btn { border: 2px solid #e2e8f0; transition: all 0.2s; }
        .time-btn.active { border-color: var(--primary); background: rgba(26,82,118,0.08); color: var(--primary); }

        .person-item { transition: all 0.2s; }
        .person-item:active { background: #f1f5f9; }

        .action-btn { transition: all 0.2s; }
        .action-btn:active { transform: scale(0.98); }

        .safe-area-bottom { padding-bottom: env(safe-area-inset-bottom, 0px); }
    </style>
</head>
<body class="pb-6">
    <!-- 顶部导航 -->
    <div class="nav-header text-white px-4 py-3 flex items-center justify-between sticky top-0 z-30">
        <a href="#" onclick="handleBack(event)" class="text-white"><i class="fas fa-arrow-left text-lg"></i></a>
        <h1 class="text-base font-semibold">发起流动申请</h1>
        <button onclick="saveAsDraft()" class="text-white/80 text-xs">存草稿</button>
    </div>

    <div class="p-4 space-y-4">
        <!-- 发起民警 -->
        <div class="app-card rounded-2xl p-4">
            <h3 class="text-sm font-semibold text-gray-800 mb-3 flex items-center gap-1">
                <span class="text-red-500">*</span>发起民警
            </h3>
            <input type="text" class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm outline-none bg-gray-50" value="张警官" placeholder="请输入发起民警姓名">
        </div>

        <!-- 流动类型 -->
        <div class="app-card rounded-2xl p-4">
            <h3 class="text-sm font-semibold text-gray-800 mb-3 flex items-center gap-1">
                <span class="text-red-500">*</span>流动类型
            </h3>
            <div class="grid grid-cols-3 gap-3">
                <button onclick="selectType(this)" class="type-btn active rounded-xl py-3 text-center text-sm text-gray-600">监内就医</button>
                <button onclick="selectType(this)" class="type-btn rounded-xl py-3 text-center text-sm text-gray-600">会见</button>
                <button onclick="selectType(this)" class="type-btn rounded-xl py-3 text-center text-sm text-gray-600">教育学习</button>
                <button onclick="selectType(this)" class="type-btn rounded-xl py-3 text-center text-sm text-gray-600">送餐送货</button>
                <button onclick="selectType(this)" class="type-btn rounded-xl py-3 text-center text-sm text-gray-600">劳动调配</button>
                <button onclick="selectType(this)" class="type-btn rounded-xl py-3 text-center text-sm text-gray-600">其他</button>
            </div>
        </div>

        <!-- 流动人员 -->
        <div class="app-card rounded-2xl p-4">
            <div class="flex items-center justify-between mb-3">
                <h3 class="text-sm font-semibold text-gray-800 flex items-center gap-1">
                    <span class="text-red-500">*</span>流动人员
                    <span class="text-xs text-gray-400 font-normal">(单次≤10人)</span>
                </h3>
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="scanAddPerson()" class="action-btn bg-blue-50 text-blue-600 rounded-xl py-3 text-sm font-medium flex items-center justify-center gap-2">
                        <i class="fas fa-camera"></i><span>人脸添加</span>
                    </button>
                    <button onclick="showPersonSelect()" class="action-btn bg-gray-100 text-gray-600 rounded-xl py-3 text-sm font-medium flex items-center justify-center gap-2">
                        <i class="fas fa-list"></i><span>手动选择</span>
                    </button>
                </div>
            </div>
            <div class="space-y-2" id="personList">
                <div class="person-item flex items-center gap-3 p-3 bg-gray-50 rounded-xl">
                    <div class="w-10 h-10 rounded-xl bg-gray-200 flex items-center justify-center text-gray-400"><i class="fas fa-user text-sm"></i></div>
                    <div class="flex-1">
                        <p class="text-sm font-medium text-gray-800">张某某</p>
                        <p class="text-xs text-gray-400">430100-0105 · 1-2监区</p>
                    </div>
                    <button class="text-gray-400"><i class="fas fa-times"></i></button>
                </div>
            </div>
        </div>

        <!-- 目标区域与事由 -->
        <div class="app-card rounded-2xl p-4 space-y-4">
            <div>
                <label class="text-sm text-gray-600 mb-2 block flex items-center gap-1">
                    <span class="text-red-500">*</span>目标区域
                </label>
                <select class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm outline-none focus:border-blue-500 bg-gray-50">
                    <option>请选择目标区域</option>
                    <option>医疗监区</option>
                    <option>会见楼</option>
                    <option>教学楼</option>
                    <option>食堂</option>
                    <option>活动场</option>
                </select>
            </div>
            <div>
                <label class="text-sm text-gray-600 mb-2 block flex items-center gap-1">
                    <span class="text-red-500">*</span>事由说明
                </label>
                <textarea class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm outline-none resize-none bg-gray-50" rows="3" placeholder="请输入流动事由"></textarea>
            </div>
            <div>
                <label class="text-sm text-gray-600 mb-2 block">预计时长</label>
                <div class="grid grid-cols-4 gap-2">
                    <button class="time-btn active rounded-xl py-2.5 text-xs font-medium" onclick="selectTime(this)">30分钟</button>
                    <button class="time-btn rounded-xl py-2.5 text-xs text-gray-500" onclick="selectTime(this)">1小时</button>
                    <button class="time-btn rounded-xl py-2.5 text-xs text-gray-500" onclick="selectTime(this)">2小时</button>
                    <button class="time-btn rounded-xl py-2.5 text-xs text-gray-500" onclick="selectTime(this)">自定义</button>
                </div>
            </div>
        </div>

        <!-- 加急选项 -->
        <div class="app-card rounded-2xl p-4 flex items-center justify-between">
            <div>
                <p class="text-sm font-medium text-gray-800">加急申请</p>
                <p class="text-xs text-gray-400 mt-1">审批时限缩短至30分钟，推送指挥中心</p>
            </div>
            <label class="relative inline-flex items-center cursor-pointer">
                <input type="checkbox" class="sr-only peer">
                <div class="w-11 h-6 bg-gray-200 rounded-full peer-checked:bg-red-500 transition-colors"></div>
                <div class="absolute left-0.5 top-0.5 w-5 h-5 bg-white rounded-full shadow peer-checked:translate-x-5 transition-transform"></div>
            </label>
        </div>

        <!-- 提交按钮 -->
        <button onclick="submitApply()" class="action-btn w-full bg-gradient-to-r from-blue-600 to-blue-700 text-white rounded-2xl py-4 font-semibold text-sm shadow-lg flex items-center justify-center gap-2 safe-area-bottom">
            <i class="fas fa-paper-plane"></i>
            <span>提交申请</span>
        </button>

        <div class="h-4"></div>
    </div>

    <!-- 人员选择弹窗 -->
    <div id="personModal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-end">
        <div class="bg-white rounded-t-2xl w-full p-4 pb-8 max-h-[70vh] flex flex-col">
            <div class="w-12 h-1 bg-gray-300 rounded-full mx-auto mb-4"></div>
            <h3 class="text-base font-semibold text-gray-800 mb-3">选择流动人员</h3>
            <input type="text" class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm outline-none mb-3" placeholder="搜索姓名或编号">
            <div class="flex-1 overflow-y-auto space-y-2">
                <div onclick="selectPerson(this, '张某某', '430100-0105')" class="flex items-center gap-3 p-3 bg-gray-50 rounded-xl cursor-pointer">
                    <div class="w-10 h-10 rounded-xl bg-gray-200 flex items-center justify-center text-gray-400"><i class="fas fa-user text-sm"></i></div>
                    <div class="flex-1"><p class="text-sm font-medium text-gray-800">张某某</p><p class="text-xs text-gray-400">430100-0105 · 1-2监区</p></div>
                    <i class="fas fa-check text-green-500 hidden"></i>
                </div>
                <div onclick="selectPerson(this, '李某某', '430100-0106')" class="flex items-center gap-3 p-3 bg-gray-50 rounded-xl cursor-pointer">
                    <div class="w-10 h-10 rounded-xl bg-gray-200 flex items-center justify-center text-gray-400"><i class="fas fa-user text-sm"></i></div>
                    <div class="flex-1"><p class="text-sm font-medium text-gray-800">李某某</p><p class="text-xs text-gray-400">430100-0106 · 1-2监区</p></div>
                    <i class="fas fa-check text-green-500 hidden"></i>
                </div>
                <div onclick="selectPerson(this, '王某某', '430100-0107')" class="flex items-center gap-3 p-3 bg-gray-50 rounded-xl cursor-pointer">
                    <div class="w-10 h-10 rounded-xl bg-gray-200 flex items-center justify-center text-gray-400"><i class="fas fa-user text-sm"></i></div>
                    <div class="flex-1"><p class="text-sm font-medium text-gray-800">王某某</p><p class="text-xs text-gray-400">430100-0107 · 1-2监区</p></div>
                    <i class="fas fa-check text-green-500 hidden"></i>
                </div>
            </div>
            <button onclick="hidePersonSelect()" class="action-btn w-full bg-blue-600 text-white rounded-xl py-3 text-sm font-medium mt-4">确认选择</button>
        </div>
    </div>

    <!-- 返回确认弹窗 -->
    <div id="backModal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-6">
        <div class="bg-white rounded-2xl p-5 w-full max-w-sm">
            <div class="text-center mb-4">
                <div class="w-14 h-14 mx-auto rounded-full bg-blue-100 flex items-center justify-center mb-3">
                    <i class="fas fa-file-import text-blue-600 text-2xl"></i>
                </div>
                <h3 class="text-base font-semibold text-gray-800">是否保存为草稿？</h3>
                <p class="text-sm text-gray-500 mt-1">您填写的内容将保存为草稿，下次可继续编辑</p>
            </div>
            <div class="space-y-2">
                <button onclick="saveDraftAndGoBack()" class="action-btn w-full bg-blue-600 text-white rounded-xl py-3 text-sm font-medium">保存并退出</button>
                <button onclick="discardAndGoBack()" class="action-btn w-full bg-gray-100 text-gray-600 rounded-xl py-3 text-sm font-medium">不保存</button>
                <button onclick="closeBackModal()" class="action-btn w-full text-gray-400 py-2 text-sm">取消</button>
            </div>
        </div>
    </div>

    <script>
        let personCount = 0;
        let selectedPersons = [];

        function handleBack(e) {
            e.preventDefault();
            // Check if there's any content entered
            const inputs = document.querySelectorAll('input, textarea, select');
            let hasContent = false;
            inputs.forEach(input => {
                if (input.value && input.value.trim()) hasContent = true;
            });
            if (hasContent || personCount > 0) {
                document.getElementById('backModal').classList.remove('hidden');
            } else {
                window.location.href = '../../home.html';
            }
        }

        function closeBackModal() {
            document.getElementById('backModal').classList.add('hidden');
        }

        function saveDraftAndGoBack() {
            alert('已保存为草稿');
            closeBackModal();
            window.location.href = '../../home.html';
        }

        function discardAndGoBack() {
            closeBackModal();
            window.location.href = '../../home.html';
        }

        function saveAsDraft() {
            alert('已保存为草稿');
            window.location.href = '../../home.html';
        }

        function scanAddPerson() {
            // 跳转到人脸扫描页面
            window.location.href = 'face-scan.html';
        }

        function showPersonSelect() {
            document.getElementById('personModal').classList.remove('hidden');
        }

        function hidePersonSelect() {
            document.getElementById('personModal').classList.add('hidden');
        }

        function selectPerson(el, name, id) {
            // Toggle selection
            const checkIcon = el.querySelector('.fa-check');
            if (checkIcon.classList.contains('hidden')) {
                if (personCount >= 10) {
                    alert('最多添加10人');
                    return;
                }
                checkIcon.classList.remove('hidden');
                el.classList.add('bg-green-50');
                selectedPersons.push({ name, id });
                addPersonToList(name, id);
            } else {
                checkIcon.classList.add('hidden');
                el.classList.remove('bg-green-50');
                selectedPersons = selectedPersons.filter(p => p.id !== id);
                removePersonFromList(id);
            }
        }

        function addPersonToList(name, id) {
            const list = document.getElementById('personList');
            list.innerHTML += `<div class="flex items-center gap-3 p-3 bg-gray-50 rounded-xl">
                <div class="w-10 h-10 rounded-xl bg-gray-200 flex items-center justify-center text-gray-400"><i class="fas fa-user text-sm"></i></div>
                <div class="flex-1">
                    <p class="text-sm font-medium text-gray-800">${name}</p>
                    <p class="text-xs text-gray-400">${id} · 1-2监区</p>
                </div>
                <button onclick="removePersonFromList('${id}'); this.parentElement.remove();" class="text-gray-400"><i class="fas fa-times"></i></button>
            </div>`;
            personCount++;
        }

        function removePersonFromList(id) {
            selectedPersons = selectedPersons.filter(p => p.id !== id);
            personCount--;
        }

        function selectType(btn) {
            document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }
        function selectTime(btn) {
            document.querySelectorAll('.time-btn').forEach(b => {
                b.classList.remove('active', 'text-blue-600');
                b.classList.add('text-gray-500');
            });
            btn.classList.add('active');
            btn.classList.remove('text-gray-500');
        }
        function submitApply() {
            if (selectedPersons.length === 0) {
                alert('请添加流动人员');
                return;
            }
            if (confirm('确认提交流动申请？')) {
                alert('申请已提交，等待审批');
                window.location.href = 'list.html';
            }
        }
    </script>
</body>
</html>
