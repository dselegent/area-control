<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>流动审批 - 执勤干警APP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #1a5276; --primary-light: #2874a6; }
        * { font-family: 'Noto Sans SC', -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #f1f5f9; }

        .nav-header { background: linear-gradient(145deg, #1a5276 0%, #2874a6 100%); }

        .app-card { background: #fff; border: 1px solid rgba(226,232,240,0.8); box-shadow: 0 2px 8px -2px rgba(0,0,0,0.06); }

        .tab-btn { transition: all 0.2s; }
        .tab-btn.active { color: var(--primary); border-color: var(--primary); background: rgba(26,82,118,0.08); }

        .approve-card { transition: all 0.2s; }
        .approve-card:active { background: #f8fafc; }

        .action-btn { transition: all 0.2s; }
        .action-btn:active { transform: scale(0.98); }

        .tab-item { transition: all 0.2s; }
        .tab-item.active { color: var(--primary); }

        .safe-area-bottom { padding-bottom: env(safe-area-inset-bottom, 0px); }
    </style>
</head>
<body class="pb-24">
    <!-- 顶部导航 -->
    <div class="nav-header text-white px-4 py-3 flex items-center justify-between sticky top-0 z-30">
        <a href="../../home.html" class="text-white"><i class="fas fa-arrow-left text-lg"></i></a>
        <h1 class="text-base font-semibold">流动审批</h1>
        <span class="text-xs text-orange-300">待审批 3</span>
    </div>

    <div class="p-4 space-y-4">
        <!-- 筛选标签 -->
        <div class="flex gap-2 overflow-x-auto pb-1">
            <button onclick="filterList(this)" class="tab-btn active flex-shrink-0 px-4 py-1.5 text-xs rounded-full border-2 border-gray-200 text-gray-600">待审批 (3)</button>
            <button onclick="filterList(this)" class="tab-btn flex-shrink-0 px-4 py-1.5 text-xs rounded-full border-2 border-gray-200 text-gray-600">已审批</button>
            <button onclick="filterList(this)" class="tab-btn flex-shrink-0 px-4 py-1.5 text-xs rounded-full border-2 border-gray-200 text-gray-600">已驳回</button>
        </div>

        <!-- 待审批卡片1 - 加急 -->
        <div class="approve-card app-card rounded-2xl p-4 border-l-4 border-red-500">
            <div class="flex items-center justify-between mb-3">
                <div class="flex items-center gap-2">
                    <span class="text-xs bg-red-100 text-red-600 px-2 py-1 rounded-full">加急</span>
                    <span class="text-xs text-gray-500">监内就医</span>
                </div>
                <span class="text-xs text-red-500 font-medium">剩余 12分钟</span>
            </div>
            <div class="flex items-center gap-3 mb-4">
                <div class="w-12 h-12 rounded-xl bg-gray-200 flex items-center justify-center text-gray-400"><i class="fas fa-user text-lg"></i></div>
                <div class="flex-1">
                    <p class="text-sm font-semibold text-gray-800">张某某 · 430100-0105</p>
                    <p class="text-xs text-gray-500 mt-0.5">1-2监区 → 医疗监区</p>
                    <p class="text-xs text-gray-400 mt-1">申请人: 李警官 · 3监区 · 10:15提交</p>
                </div>
            </div>
            <div class="flex gap-2">
                <button onclick="approveFlow()" class="action-btn flex-1 bg-green-500 text-white rounded-xl py-2.5 text-sm font-medium">
                    <i class="fas fa-check mr-1"></i>通过
                </button>
                <button onclick="rejectFlow()" class="action-btn flex-1 bg-white border border-gray-200 text-gray-700 rounded-xl py-2.5 text-sm font-medium">
                    <i class="fas fa-times mr-1"></i>驳回
                </button>
                <button class="w-10 h-10 bg-gray-100 rounded-xl flex items-center justify-center text-gray-500">
                    <i class="fas fa-phone"></i>
                </button>
            </div>
        </div>

        <!-- 待审批卡片2 -->
        <div class="approve-card app-card rounded-2xl p-4">
            <div class="flex items-center justify-between mb-3">
                <div class="flex items-center gap-2">
                    <span class="text-xs bg-yellow-100 text-yellow-600 px-2 py-1 rounded-full">普通</span>
                    <span class="text-xs text-gray-500">教育学习</span>
                </div>
                <span class="text-xs text-gray-400">等待中</span>
            </div>
            <div class="flex items-center gap-3 mb-4">
                <div class="w-12 h-12 rounded-xl bg-gray-200 flex items-center justify-center text-gray-400"><i class="fas fa-user text-lg"></i></div>
                <div class="flex-1">
                    <p class="text-sm font-semibold text-gray-800">赵某某 · 430100-0089</p>
                    <p class="text-xs text-gray-500 mt-0.5">1-2监区 → 教学楼</p>
                    <p class="text-xs text-gray-400 mt-1">申请人: 王警官 · 1-2监区 · 09:45提交</p>
                </div>
            </div>
            <div class="flex gap-2">
                <button onclick="approveFlow()" class="action-btn flex-1 bg-green-500 text-white rounded-xl py-2.5 text-sm font-medium">
                    <i class="fas fa-check mr-1"></i>通过
                </button>
                <button onclick="rejectFlow()" class="action-btn flex-1 bg-white border border-gray-200 text-gray-700 rounded-xl py-2.5 text-sm font-medium">
                    <i class="fas fa-times mr-1"></i>驳回
                </button>
                <button class="w-10 h-10 bg-gray-100 rounded-xl flex items-center justify-center text-gray-500">
                    <i class="fas fa-phone"></i>
                </button>
            </div>
        </div>

        <!-- 待审批卡片3 -->
        <div class="approve-card app-card rounded-2xl p-4">
            <div class="flex items-center justify-between mb-3">
                <div class="flex items-center gap-2">
                    <span class="text-xs bg-yellow-100 text-yellow-600 px-2 py-1 rounded-full">普通</span>
                    <span class="text-xs text-gray-500">会见</span>
                </div>
                <span class="text-xs text-gray-400">等待中</span>
            </div>
            <div class="flex items-center gap-3 mb-4">
                <div class="w-12 h-12 rounded-xl bg-gray-200 flex items-center justify-center text-gray-400"><i class="fas fa-user text-lg"></i></div>
                <div class="flex-1">
                    <p class="text-sm font-semibold text-gray-800">刘某某 · 430100-0112</p>
                    <p class="text-xs text-gray-500 mt-0.5">1-2监区 → 会见楼</p>
                    <p class="text-xs text-gray-400 mt-1">申请人: 张警�� · 1-2监区 · 09:30提交</p>
                </div>
            </div>
            <div class="flex gap-2">
                <button onclick="approveFlow()" class="action-btn flex-1 bg-green-500 text-white rounded-xl py-2.5 text-sm font-medium">
                    <i class="fas fa-check mr-1"></i>通过
                </button>
                <button onclick="rejectFlow()" class="action-btn flex-1 bg-white border border-gray-200 text-gray-700 rounded-xl py-2.5 text-sm font-medium">
                    <i class="fas fa-times mr-1"></i>驳回
                </button>
                <button class="w-10 h-10 bg-gray-100 rounded-xl flex items-center justify-center text-gray-500">
                    <i class="fas fa-phone"></i>
                </button>
            </div>
        </div>

        <div class="h-4"></div>
    </div>

    <!-- 底部Tab栏 -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex items-center justify-around py-2 safe-area-bottom">
        <a href="../../home.html" class="tab-item flex flex-col items-center py-1.5 px-4 text-gray-400">
            <div class="w-8 h-8 rounded-lg flex items-center justify-center"><i class="fas fa-home text-lg"></i></div>
            <span class="text-[11px] mt-1">首页</span>
        </a>
        <a href="list.html" class="tab-item active flex flex-col items-center py-1.5 px-4">
            <div class="w-8 h-8 rounded-lg bg-blue-50 flex items-center justify-center"><i class="fas fa-walking text-lg"></i></div>
            <span class="text-[11px] mt-1 text-blue-600">流动</span>
        </a>
        <a href="../alert/list.html" class="tab-item flex flex-col items-center py-1.5 px-4 text-gray-400">
            <div class="w-8 h-8 rounded-lg flex items-center justify-center"><i class="fas fa-bell text-lg"></i></div>
            <span class="text-[11px] mt-1">预警</span>
        </a>
        <a href="../msg/list.html" class="tab-item flex flex-col items-center py-1.5 px-4 text-gray-400">
            <div class="w-8 h-8 rounded-lg flex items-center justify-center"><i class="fas fa-envelope text-lg"></i></div>
            <span class="text-[11px] mt-1">消息</span>
        </a>
        <a href="../profile/index.html" class="tab-item flex flex-col items-center py-1.5 px-4 text-gray-400">
            <div class="w-8 h-8 rounded-lg flex items-center justify-center"><i class="fas fa-user text-lg"></i></div>
            <span class="text-[11px] mt-1">我的</span>
        </a>
    </nav>

    <script>
        function filterList(btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }
        function approveFlow() {
            if (confirm('确认通过该流动申请？')) alert('已通过');
        }
        function rejectFlow() {
            const reason = prompt('请输入驳回理由：');
            if (reason) alert('已驳回');
        }
    </script>
</body>
</html>
