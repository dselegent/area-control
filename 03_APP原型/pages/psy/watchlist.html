<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>关注名单 - 执勤干警APP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #1a5276; --primary-light: #2874a6; }
        * { font-family: 'Noto Sans SC', -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #f1f5f9; }

        .nav-header { background: linear-gradient(145deg, #1a5276 0%, #2874a6 100%); }

        .app-card { background: #fff; border: 1px solid rgba(226,232,240,0.8); box-shadow: 0 2px 8px -2px rgba(0,0,0,0.06); }

        .tab-item { transition: all 0.2s; }
        .tab-item.active { color: var(--primary); }

        .tab-btn { transition: all 0.2s; }
        .tab-btn.active { color: var(--primary); border-color: var(--primary); background: rgba(26,82,118,0.08); }

        .person-card { transition: all 0.2s; }
        .person-card:active { background: #f8fafc; }

        .stat-box { transition: all 0.2s; }

        .safe-area-bottom { padding-bottom: env(safe-area-inset-bottom, 0px); }
    </style>
</head>
<body class="pb-24">
    <!-- 顶部导航 -->
    <div class="nav-header text-white px-4 py-3 flex items-center justify-between sticky top-0 z-30">
        <a href="../../home.html" class="text-white"><i class="fas fa-arrow-left text-lg"></i></a>
        <h1 class="text-base font-semibold">心理感知 · 关注名单</h1>
        <a href="rating.html" class="text-xs text-white/80">风险评级</a>
    </div>

    <div class="p-4 space-y-4">
        <!-- 统计 -->
        <div class="grid grid-cols-2 gap-3">
            <div class="stat-box bg-red-50 border border-red-200 rounded-2xl p-4 text-center">
                <p class="text-2xl font-bold text-red-500">5</p>
                <p class="text-xs text-red-600">高风险人员</p>
            </div>
            <div class="stat-box bg-orange-50 border border-orange-200 rounded-2xl p-4 text-center">
                <p class="text-2xl font-bold text-orange-500">12</p>
                <p class="text-xs text-orange-600">中风险人员</p>
            </div>
        </div>

        <!-- 筛选 -->
        <div class="flex gap-2 overflow-x-auto pb-1">
            <button onclick="filterList(this)" class="tab-btn active flex-shrink-0 px-4 py-1.5 text-xs rounded-full border-2 border-gray-200 text-gray-600">全部</button>
            <button onclick="filterList(this)" class="tab-btn flex-shrink-0 px-4 py-1.5 text-xs rounded-full border-2 border-red-200 text-red-600">高风险</button>
            <button onclick="filterList(this)" class="tab-btn flex-shrink-0 px-4 py-1.5 text-xs rounded-full border-2 border-orange-200 text-orange-600">中风险</button>
        </div>

        <!-- 人员列表 -->
        <div class="space-y-3">
            <a href="rating.html" class="person-card app-card rounded-2xl p-4 border-l-4 border-red-500">
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12 rounded-xl bg-gray-200 flex items-center justify-center text-gray-400"><i class="fas fa-user text-lg"></i></div>
                    <div class="flex-1">
                        <div class="flex items-center gap-2">
                            <span class="text-sm font-bold text-gray-800">李某某</span>
                            <span class="text-xs bg-red-100 text-red-600 px-2 py-0.5 rounded-full">高风险</span>
                        </div>
                        <p class="text-xs text-gray-400">430100-0128 · 1-2监区</p>
                        <p class="text-xs text-red-500 mt-1">涉暴力 · 近期情绪波动</p>
                    </div>
                    <i class="fas fa-chevron-right text-gray-300 text-xs"></i>
                </div>
            </a>

            <a href="rating.html" class="person-card app-card rounded-2xl p-4 border-l-4 border-red-500">
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12 rounded-xl bg-gray-200 flex items-center justify-center text-gray-400"><i class="fas fa-user text-lg"></i></div>
                    <div class="flex-1">
                        <div class="flex items-center gap-2">
                            <span class="text-sm font-bold text-gray-800">钱某某</span>
                            <span class="text-xs bg-red-100 text-red-600 px-2 py-0.5 rounded-full">高风险</span>
                        </div>
                        <p class="text-xs text-gray-400">430100-0178 · 1-2监区</p>
                        <p class="text-xs text-red-500 mt-1">有自伤倾向 · 心理干预中</p>
                    </div>
                    <i class="fas fa-chevron-right text-gray-300 text-xs"></i>
                </div>
            </a>

            <a href="rating.html" class="person-card app-card rounded-2xl p-4 border-l-4 border-orange-500">
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12 rounded-xl bg-gray-200 flex items-center justify-center text-gray-400"><i class="fas fa-user text-lg"></i></div>
                    <div class="flex-1">
                        <div class="flex items-center gap-2">
                            <span class="text-sm font-bold text-gray-800">周某某</span>
                            <span class="text-xs bg-orange-100 text-orange-600 px-2 py-0.5 rounded-full">中风险</span>
                        </div>
                        <p class="text-xs text-gray-400">430100-0156 · 1-2监区</p>
                        <p class="text-xs text-orange-500 mt-1">涉毒 · 近期会见后情绪变化</p>
                    </div>
                    <i class="fas fa-chevron-right text-gray-300 text-xs"></i>
                </div>
            </a>

            <a href="rating.html" class="person-card app-card rounded-2xl p-4 border-l-4 border-orange-500">
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12 rounded-xl bg-gray-200 flex items-center justify-center text-gray-400"><i class="fas fa-user text-lg"></i></div>
                    <div class="flex-1">
                        <div class="flex items-center gap-2">
                            <span class="text-sm font-bold text-gray-800">吴某某</span>
                            <span class="text-xs bg-orange-100 text-orange-600 px-2 py-0.5 rounded-full">中风险</span>
                        </div>
                        <p class="text-xs text-gray-400">430100-0215 · 1-2监区</p>
                        <p class="text-xs text-orange-500 mt-1">短刑期 · 适应困难</p>
                    </div>
                    <i class="fas fa-chevron-right text-gray-300 text-xs"></i>
                </div>
            </a>
        </div>

        <div class="h-4"></div>
    </div>

    <!-- 底部Tab栏 -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex items-center justify-around py-2 safe-area-bottom">
        <a href="../../home.html" class="tab-item flex flex-col items-center py-1.5 px-4 text-gray-400">
            <div class="w-8 h-8 rounded-lg flex items-center justify-center"><i class="fas fa-home text-lg"></i></div>
            <span class="text-[11px] mt-1">首页</span>
        </a>
        <a href="../flow/list.html" class="tab-item flex flex-col items-center py-1.5 px-4 text-gray-400">
            <div class="w-8 h-8 rounded-lg flex items-center justify-center"><i class="fas fa-walking text-lg"></i></div>
            <span class="text-[11px] mt-1">流动</span>
        </a>
        <a href="../alert/list.html" class="tab-item flex flex-col items-center py-1.5 px-4 text-gray-400">
            <div class="w-8 h-8 rounded-lg flex items-center justify-center"><i class="fas fa-bell text-lg"></i></div>
            <span class="text-[11px] mt-1">预警</span>
        </a>
        <a href="../msg/list.html" class="tab-item flex flex-col items-center py-1.5 px-4 text-gray-400">
            <div class="w-8 h-8 rounded-lg flex items-center justify-center"><i class="fas fa-envelope text-lg"></i></div>
            <span class="text-[11px] mt-1">消息</span>
        </a>
        <a href="../profile/index.html" class="tab-item flex flex-col items-center py-1.5 px-4 text-gray-400">
            <div class="w-8 h-8 rounded-lg flex items-center justify-center"><i class="fas fa-user text-lg"></i></div>
            <span class="text-[11px] mt-1">我的</span>
        </a>
    </nav>

    <script>
        function filterList(btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }
    </script>
</body>
</html>
