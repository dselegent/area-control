<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>风险评级 - 执勤干警APP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #1a5276; --primary-light: #2874a6; }
        * { font-family: 'Noto Sans SC', -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #f1f5f9; }

        .nav-header { background: linear-gradient(145deg, #1a5276 0%, #2874a6 100%); }

        .app-card { background: #fff; border: 1px solid rgba(226,232,240,0.8); box-shadow: 0 2px 8px -2px rgba(0,0,0,0.06); }

        .info-card { background: linear-gradient(145deg, #dc2626 0%, #b91c1c 100%); }

        .dimension-bar { background: #e2e8f0; border-radius: 999px; overflow: hidden; }
        .dimension-fill { border-radius: 999px; transition: width 0.5s ease; }

        .safe-area-bottom { padding-bottom: env(safe-area-inset-bottom, 0px); }
    </style>
</head>
<body>
    <!-- 顶部导航 -->
    <div class="nav-header text-white px-4 py-3 flex items-center justify-between sticky top-0 z-30">
        <a href="watchlist.html" class="text-white"><i class="fas fa-arrow-left text-lg"></i></a>
        <h1 class="text-base font-semibold">风险评级详情</h1>
        <div class="text-white/80 text-xs"></div>
    </div>

    <div class="p-4 space-y-4">
        <!-- 人员信息 -->
        <div class="app-card rounded-2xl p-4">
            <div class="flex items-center gap-4">
                <div class="w-16 h-20 rounded-xl bg-gray-200 flex items-center justify-center flex-shrink-0">
                    <div class="text-center text-gray-400">
                        <i class="fas fa-user text-2xl"></i>
                        <p class="text-xs mt-1">照片</p>
                    </div>
                </div>
                <div class="flex-1">
                    <div class="flex items-center gap-2">
                        <h2 class="text-base font-bold text-gray-800">李某某</h2>
                        <span class="text-xs bg-red-100 text-red-600 px-2 py-0.5 rounded-full">高风险</span>
                    </div>
                    <p class="text-xs text-gray-500 mt-1">编号 430100-0128 · 1-2监区</p>
                    <p class="text-xs text-gray-500">故意伤害罪 · 2022.03-2029.03</p>
                </div>
            </div>
            <div class="flex flex-wrap gap-2 mt-4">
                <span class="text-xs bg-red-50 text-red-600 px-2 py-1 rounded-full">涉暴力</span>
                <span class="text-xs bg-orange-50 text-orange-600 px-2 py-1 rounded-full">高风险</span>
                <span class="text-xs bg-yellow-50 text-yellow-600 px-2 py-1 rounded-full">短刑期</span>
                <span class="text-xs bg-blue-50 text-blue-600 px-2 py-1 rounded-full">心理干预中</span>
            </div>
        </div>

        <!-- 当前风险等级 -->
        <div class="info-card rounded-2xl p-4 text-white">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-sm font-semibold">当前风险等级</h3>
                <span class="text-xs bg-white/20 px-2 py-1 rounded-full">更新于 2026-05-21</span>
            </div>
            <div class="flex items-center gap-4">
                <div class="text-4xl font-bold">高</div>
                <div class="flex-1">
                    <div class="flex items-center gap-2 mb-1">
                        <span class="text-xs text-red-200">风险指数</span>
                        <span class="text-lg font-bold">85/100</span>
                    </div>
                    <div class="w-full h-2 bg-white/20 rounded-full overflow-hidden">
                        <div class="h-full bg-white rounded-full" style="width: 85%"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 风险趋势 -->
        <div class="app-card rounded-2xl p-4">
            <h3 class="text-sm font-semibold text-gray-800 mb-4">风险趋势（近30天）</h3>
            <div class="bg-gray-100 rounded-xl h-32 flex items-center justify-center">
                <div class="text-center text-gray-400">
                    <i class="fas fa-chart-line text-2xl mb-1"></i>
                    <p class="text-xs">风险趋势图</p>
                </div>
            </div>
            <div class="grid grid-cols-3 gap-3 mt-4 text-center">
                <div>
                    <p class="text-xs text-gray-400">本月均值</p>
                    <p class="text-lg font-bold text-red-500">78</p>
                </div>
                <div>
                    <p class="text-xs text-gray-400">上月均值</p>
                    <p class="text-lg font-bold text-orange-500">65</p>
                </div>
                <div>
                    <p class="text-xs text-gray-400">变化趋势</p>
                    <p class="text-lg font-bold text-red-500"><i class="fas fa-arrow-up"></i> +13</p>
                </div>
            </div>
        </div>

        <!-- 评估维度 -->
        <div class="app-card rounded-2xl p-4">
            <h3 class="text-sm font-semibold text-gray-800 mb-4">评估维度</h3>
            <div class="space-y-4">
                <div>
                    <div class="flex items-center justify-between text-xs mb-1.5">
                        <span class="text-gray-600">行为表现</span>
                        <span class="font-medium text-red-500">高危</span>
                    </div>
                    <div class="w-full h-2 dimension-bar">
                        <div class="h-full dimension-fill bg-red-500" style="width: 90%"></div>
                    </div>
                </div>
                <div>
                    <div class="flex items-center justify-between text-xs mb-1.5">
                        <span class="text-gray-600">情绪状态</span>
                        <span class="font-medium text-orange-500">中高</span>
                    </div>
                    <div class="w-full h-2 dimension-bar">
                        <div class="h-full dimension-fill bg-orange-500" style="width: 75%"></div>
                    </div>
                </div>
                <div>
                    <div class="flex items-center justify-between text-xs mb-1.5">
                        <span class="text-gray-600">社交关系</span>
                        <span class="font-medium text-yellow-500">中等</span>
                    </div>
                    <div class="w-full h-2 dimension-bar">
                        <div class="h-full dimension-fill bg-yellow-500" style="width: 55%"></div>
                    </div>
                </div>
                <div>
                    <div class="flex items-center justify-between text-xs mb-1.5">
                        <span class="text-gray-600">改造表现</span>
                        <span class="font-medium text-orange-500">中高</span>
                    </div>
                    <div class="w-full h-2 dimension-bar">
                        <div class="h-full dimension-fill bg-orange-500" style="width: 70%"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="h-4"></div>
    </div>
</body>
</html>
