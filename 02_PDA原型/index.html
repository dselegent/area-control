<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>登录 - PDA手持终端</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1a5276;
            --primary-dark: #154360;
            --accent: #3498db;
            --glow: #5dade2;
            --surface: rgba(255,255,255,0.95);
            --surface-glass: rgba(255,255,255,0.85);
        }

        * {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* 深邃科技背景 */
        body {
            background:
                radial-gradient(ellipse at top, #1a5276 0%, #154360 40%, #0d1f2d 100%);
            min-height: 100vh;
            position: relative;
            overflow: hidden;
        }

        /* 动态网格纹理 */
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(52,152,219,0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(52,152,219,0.08) 1px, transparent 1px);
            background-size: 40px 40px;
            animation: gridMove 20s linear infinite;
            pointer-events: none;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(40px, 40px); }
        }

        /* 顶部光带 */
        body::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 200px;
            background: linear-gradient(180deg, rgba(52,152,219,0.15) 0%, transparent 100%);
            pointer-events: none;
        }

        /* 登录卡片 - 玻璃拟态 */
        .login-card {
            background: var(--surface-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.3);
            box-shadow:
                0 25px 50px -12px rgba(0,0,0,0.4),
                0 0 0 1px rgba(255,255,255,0.1) inset,
                0 0 80px -20px rgba(52,152,219,0.3);
            position: relative;
            overflow: hidden;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
        }

        /* 输入框样式 */
        .input-field {
            background: rgba(244,247,250,0.8);
            border: 1.5px solid #e5e9ed;
            transition: all 0.25s ease;
        }

        .input-field:focus {
            background: #fff;
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(52,152,219,0.1), 0 4px 12px rgba(52,152,219,0.15);
        }

        /* 主按钮 - 带发光效果 */
        .btn-primary {
            background: linear-gradient(135deg, #1a5276 0%, #2874a6 100%);
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .btn-primary::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent 40%, rgba(255,255,255,0.15) 50%, transparent 60%);
            transform: translateX(-100%);
            transition: transform 0.5s ease;
        }

        .btn-primary:hover::before {
            transform: translateX(100%);
        }

        .btn-primary:active {
            transform: scale(0.97);
            box-shadow: 0 4px 20px rgba(26,82,118,0.4);
        }

        /* 次按钮 */
        .btn-secondary {
            background: linear-gradient(135deg, #27ae60 0%, #1e8449 100%);
            transition: all 0.25s ease;
        }

        .btn-secondary:active {
            transform: scale(0.97);
        }

        /* 状态徽章 */
        .badge-device {
            background: linear-gradient(135deg, #f39c12 0%, #d68910 100%);
            box-shadow: 0 2px 8px rgba(243,156,18,0.3);
        }

        .badge-online {
            color: #27ae60;
        }

        .badge-online::before {
            content: '';
            width: 6px;
            height: 6px;
            background: #27ae60;
            border-radius: 50%;
            margin-right: 6px;
            animation: pulse 2s ease-in-out infinite;
            box-shadow: 0 0 8px #27ae60;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.2); }
        }

        /* Logo 区域 */
        .logo-emblem {
            background: linear-gradient(145deg, #1a5276 0%, #2874a6 50%, #154360 100%);
            box-shadow:
                0 8px 32px rgba(26,82,118,0.4),
                0 0 60px -15px rgba(52,152,219,0.5),
                inset 0 1px 0 rgba(255,255,255,0.2);
            position: relative;
        }

        .logo-emblem::after {
            content: '';
            position: absolute;
            inset: 3px;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: inherit;
        }

        /* 分割线 */
        .divider-line {
            background: linear-gradient(90deg, transparent, #e5e9ed, transparent);
        }

        /* 底部安全标识 */
        .footer-badge {
            border: 1px solid rgba(52,152,219,0.2);
            background: rgba(26,82,118,0.1);
        }

        /* 加载动画容器 */
        .loader {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center px-5 py-8">
    <!-- Logo区域 -->
    <div class="text-center mb-8 animate-fade-in">
        <div class="logo-emblem w-20 h-20 mx-auto rounded-2xl flex items-center justify-center shadow-lg mb-4 relative">
            <i class="fas fa-shield-alt text-3xl text-white drop-shadow-lg"></i>
            <!-- 角落装饰 -->
            <div class="absolute -top-1 -right-1 w-4 h-4 border-t-2 border-r-2 border-white/40 rounded-tr-lg"></div>
            <div class="absolute -bottom-1 -left-1 w-4 h-4 border-b-2 border-l-2 border-white/40 rounded-bl-lg"></div>
        </div>
        <h1 class="text-white text-2xl font-semibold tracking-wide">PDA手持终端</h1>
        <div class="flex items-center justify-center gap-2 mt-2">
            <span class="w-8 h-px bg-gradient-to-r from-transparent via-white/30 to-transparent"></span>
            <p class="text-blue-200/70 text-sm font-light">湖南省监狱AI区域管控系统</p>
            <span class="w-8 h-px bg-gradient-to-r from-transparent via-white/30 to-transparent"></span>
        </div>
    </div>

    <!-- 登录卡片 -->
    <div class="login-card w-full max-w-sm rounded-2xl p-6 animate-slide-up">
        <!-- 设备绑定状态 -->
        <div class="flex items-center justify-between mb-5">
            <div class="badge-device text-white text-xs px-3 py-1.5 rounded-full flex items-center gap-1.5">
                <i class="fas fa-mobile-alt text-xs"></i>
                <span>设备已绑定</span>
            </div>
            <div class="flex items-center gap-1.5 text-xs text-gray-500">
                <span class="badge-online flex items-center">在线</span>
            </div>
        </div>

        <!-- 账号密码登录 -->
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    <i class="fas fa-user text-gray-400 mr-2"></i>用户名
                </label>
                <input type="text" id="username" class="input-field w-full px-4 py-3.5 border rounded-xl text-sm outline-none" placeholder="请输入用户名" value="zhangjingguan">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    <i class="fas fa-lock text-gray-400 mr-2"></i>密码
                </label>
                <div class="relative">
                    <input type="password" id="password" class="input-field w-full px-4 py-3.5 border rounded-xl text-sm outline-none pr-12" placeholder="请输入密码" value="********">
                    <button type="button" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 transition-colors" onclick="togglePwd()">
                        <i class="fas fa-eye" id="eyeIcon"></i>
                    </button>
                </div>
            </div>

            <div class="flex items-center justify-between text-xs">
                <label class="flex items-center cursor-pointer text-gray-500">
                    <input type="checkbox" checked class="w-4 h-4 text-blue-500 rounded border-gray-300">
                    <span class="ml-2">记住登录</span>
                </label>
            </div>

            <button onclick="doLogin(this)" class="btn-primary w-full py-3.5 rounded-xl text-white font-medium text-sm shadow-lg flex items-center justify-center gap-2">
                <i class="fas fa-sign-in-alt"></i>
                <span>登 录</span>
            </button>
        </div>

        <!-- 分割线 -->
        <div class="flex items-center gap-4 my-6">
            <div class="flex-1 h-px divider-line"></div>
            <span class="text-xs text-gray-400 uppercase tracking-wider">或</span>
            <div class="flex-1 h-px divider-line"></div>
        </div>

        <!-- 人脸识别登录 -->
        <button onclick="faceLogin(this)" class="btn-secondary w-full py-3.5 rounded-xl text-white font-medium text-sm shadow-lg flex items-center justify-center gap-2">
            <i class="fas fa-face-smile text-lg"></i>
            <span>人脸识别登录</span>
        </button>
    </div>

    <!-- 底部信息 -->
    <div class="mt-8 text-center animate-fade-in-up">
        <div class="footer-badge rounded-full px-4 py-1.5 flex items-center justify-center gap-4">
            <span class="text-xs text-blue-200/60 flex items-center gap-1.5">
                <i class="fas fa-shield-halved text-[10px]"></i>
                等保三级
            </span>
            <span class="w-px h-3 bg-white/10"></span>
            <span class="text-xs text-blue-200/60 flex items-center gap-1.5">
                <i class="fas fa-lock text-[10px]"></i>
                数据加密
            </span>
        </div>
        <p class="text-xs text-blue-200/30 mt-3">© 2026 湖南省监狱管理局</p>
    </div>

    <!-- 离线登录提示 -->
    <div id="offlineTip" class="hidden fixed bottom-6 left-6 right-6 bg-amber-500 text-white text-xs px-4 py-3 rounded-xl shadow-lg flex items-center gap-2 animate-bounce-in">
        <i class="fas fa-wifi-slash"></i>
        <span>当前为离线模式，将使用本地缓存凭证登录</span>
    </div>

    <script>
        function togglePwd() {
            const p = document.getElementById('password');
            const i = document.getElementById('eyeIcon');
            if (p.type === 'password') {
                p.type = 'text';
                i.className = 'fas fa-eye-slash';
            } else {
                p.type = 'password';
                i.className = 'fas fa-eye';
            }
        }

        function doLogin(btn) {
            const originalHTML = btn.innerHTML;
            btn.innerHTML = '<span class="loader"></span>登录中...';
            btn.disabled = true;
            btn.classList.add('opacity-80');
            setTimeout(() => {
                window.location.href = 'home.html';
            }, 1200);
        }

        function faceLogin(btn) {
            const originalHTML = btn.innerHTML;
            btn.innerHTML = '<span class="loader"></span>人脸识别中...';
            btn.disabled = true;
            btn.classList.add('opacity-80');
            setTimeout(() => {
                window.location.href = 'home.html';
            }, 2000);
        }

        // 检测离线状态
        if (!navigator.onLine) {
            document.getElementById('offlineTip').classList.remove('hidden');
        }
    </script>

    <style>
        .animate-fade-in {
            animation: fadeIn 0.6s ease-out;
        }
        .animate-slide-up {
            animation: slideUp 0.5s ease-out 0.2s both;
        }
        .animate-fade-in-up {
            animation: fadeInUp 0.5s ease-out 0.4s both;
        }
        .animate-bounce-in {
            animation: bounceIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes bounceIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</body>
</html>
