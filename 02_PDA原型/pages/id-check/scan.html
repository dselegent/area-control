<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>身份核查 - PDA手持终端</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #1a5276; --primary-light: #2874a6; }
        * { font-family: 'Noto Sans SC', -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #f1f5f9; }

        .nav-header { background: linear-gradient(145deg, #1a5276 0%, #2874a6 100%); }

        .scan-area {
            background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
            position: relative;
            overflow: hidden;
        }
        .scan-area::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, rgba(52,152,219,0.15) 0%, transparent 60%);
        }
        .scan-line { animation: scanMove 2s linear infinite; }
        @keyframes scanMove { 0% { top: 15%; } 100% { top: 85%; } }

        .corner-mark { position: absolute; width: 24px; height: 24px; border: 2px solid #5dade2; }
        .corner-tl { top: 15%; left: 15%; border-right: none; border-bottom: none; }
        .corner-tr { top: 15%; right: 15%; border-left: none; border-bottom: none; }
        .corner-bl { bottom: 15%; left: 15%; border-right: none; border-top: none; }
        .corner-br { bottom: 15%; right: 15%; border-left: none; border-top: none; }

        .risk-high { background: linear-gradient(145deg, #dc2626 0%, #b91c1c 100%); }
        .risk-medium { background: linear-gradient(145deg, #f59e0b 0%, #d97706 100%); }
        .risk-low { background: linear-gradient(145deg, #22c55e 0%, #16a34a 100%); }

        .result-card { background: #fff; border: 1px solid rgba(226,232,240,0.8); box-shadow: 0 2px 8px -2px rgba(0,0,0,0.06); }

        .action-btn { transition: all 0.2s; }
        .action-btn:active { transform: scale(0.96); }

        .quick-action { transition: all 0.2s; background: #f8fafc; }
        .quick-action:active { background: #f1f5f9; }

        .tag { font-size: 11px; padding: 2px 8px; border-radius: 999px; }
        .tag-risk-high { background: #fee2e2; color: #dc2626; }
        .tag-risk-medium { background: #fef3c7; color: #d97706; }
        .tag-risk-low { background: #dcfce7; color: #16a34a; }
        .tag-special { background: #dbeafe; color: #1d4ed8; }

        .history-item { transition: all 0.2s; }
        .history-item:active { background: #f1f5f9; }

        .tab-active { color: var(--primary); background: rgba(26,82,118,0.08); }
        .safe-area-bottom { padding-bottom: env(safe-area-inset-bottom, 0px); }
    </style>
</head>
<body class="pb-24">
    <!-- 顶部导航 -->
    <div class="nav-header text-white px-4 py-3 flex items-center justify-between sticky top-0 z-30">
        <a href="../../home.html" class="text-white"><i class="fas fa-arrow-left text-lg"></i></a>
        <h1 class="text-base font-semibold">身份核查</h1>
        <button class="text-white/80"><i class="fas fa-history text-lg"></i></button>
    </div>

    <div class="p-4 space-y-4">
        <!-- 扫码区域 -->
        <div class="scan-area rounded-2xl relative" style="height: 220px;">
            <div class="absolute inset-0 flex items-center justify-center">
                <div class="w-44 h-44 relative">
                    <div class="corner-mark corner-tl"></div>
                    <div class="corner-mark corner-tr"></div>
                    <div class="corner-mark corner-bl"></div>
                    <div class="corner-mark corner-br"></div>
                    <div class="scan-line absolute left-6 right-6 h-0.5 bg-gradient-to-r from-transparent via-blue-400 to-transparent"></div>
                </div>
            </div>
            <div class="absolute bottom-4 left-0 right-0 text-center">
                <p class="text-white/60 text-xs">将条码/二维码放入框内自动扫描</p>
            </div>
        </div>

        <!-- 操作按钮 -->
        <div class="grid grid-cols-3 gap-3">
            <button onclick="scanBarcode()" class="action-btn bg-blue-600 text-white rounded-xl py-3.5 text-center">
                <i class="fas fa-barcode text-xl mb-1.5 block"></i>
                <span class="text-xs font-medium">扫码查人</span>
            </button>
            <button onclick="scanFace()" class="action-btn bg-green-600 text-white rounded-xl py-3.5 text-center">
                <i class="fas fa-face-smile text-xl mb-1.5 block"></i>
                <span class="text-xs font-medium">人脸查人</span>
            </button>
            <button onclick="inputId()" class="action-btn bg-gray-600 text-white rounded-xl py-3.5 text-center">
                <i class="fas fa-keyboard text-xl mb-1.5 block"></i>
                <span class="text-xs font-medium">手动输入</span>
            </button>
        </div>

        <!-- 扫码结果 -->
        <div id="resultCard" class="hidden space-y-3">
            <div class="result-card rounded-xl overflow-hidden">
                <!-- 风险标识 -->
                <div class="risk-high px-4 py-2.5 flex items-center justify-between">
                    <div class="flex items-center gap-2 text-white text-sm font-medium">
                        <i class="fas fa-exclamation-triangle"></i>
                        <span>高风险人员</span>
                    </div>
                    <span class="text-xs text-white/80">涉暴力 · 重点关注</span>
                </div>

                <!-- 人员信息 -->
                <div class="p-4">
                    <div class="flex gap-4">
                        <div class="w-20 h-24 rounded-xl bg-gray-100 flex items-center justify-center flex-shrink-0">
                            <i class="fas fa-user text-3xl text-gray-400"></i>
                        </div>
                        <div class="flex-1 space-y-2">
                            <div class="flex items-center gap-2">
                                <h3 class="text-base font-bold text-gray-800">李某某</h3>
                                <span class="tag tag-risk-high">高危</span>
                            </div>
                            <div class="text-xs text-gray-500 space-y-1">
                                <p><span class="text-gray-400 w-12 inline-block">编号</span>430100-0128</p>
                                <p><span class="text-gray-400 w-12 inline-block">监区</span>1-2监区</p>
                                <p><span class="text-gray-400 w-12 inline-block">罪名</span>故意伤害罪</p>
                                <p><span class="text-gray-400 w-12 inline-block">刑期</span>2022.03 - 2029.03</p>
                            </div>
                        </div>
                    </div>

                    <!-- 标签 -->
                    <div class="flex flex-wrap gap-2 mt-3">
                        <span class="tag tag-risk-high">涉���力</span>
                        <span class="tag tag-risk-medium">高风险</span>
                        <span class="tag tag-risk-medium">短刑期</span>
                        <span class="tag tag-special">心理干预中</span>
                    </div>
                </div>

                <!-- 快捷操作 -->
                <div class="border-t border-gray-100 px-4 py-3 grid grid-cols-3 gap-2">
                    <a href="#" class="quick-action text-center p-2.5 rounded-lg">
                        <i class="fas fa-heart-pulse text-red-500 text-lg"></i>
                        <p class="text-xs text-gray-500 mt-1">心理风险</p>
                    </a>
                    <a href="#" class="quick-action text-center p-2.5 rounded-lg">
                        <i class="fas fa-clipboard-list text-blue-500 text-lg"></i>
                        <p class="text-xs text-gray-500 mt-1">考核记录</p>
                    </a>
                    <a href="#" class="quick-action text-center p-2.5 rounded-lg">
                        <i class="fas fa-map-marker-alt text-green-500 text-lg"></i>
                        <p class="text-xs text-gray-500 mt-1">当前位置</p>
                    </a>
                </div>

                <!-- 省局数据速查 -->
                <div class="border-t border-gray-100 px-4 py-3">
                    <h4 class="text-xs font-semibold text-gray-500 mb-2">省局数据速查</h4>
                    <div class="grid grid-cols-2 gap-2 text-xs">
                        <div class="flex items-center justify-between bg-gray-50 rounded-lg px-3 py-2">
                            <span class="text-gray-500">本月考核分</span>
                            <span class="font-medium text-gray-800">85分</span>
                        </div>
                        <div class="flex items-center justify-between bg-gray-50 rounded-lg px-3 py-2">
                            <span class="text-gray-500">近期会见</span>
                            <span class="font-medium text-gray-800">3天前</span>
                        </div>
                        <div class="flex items-center justify-between bg-gray-50 rounded-lg px-3 py-2">
                            <span class="text-gray-500">本月消费</span>
                            <span class="font-medium text-gray-800">320元</span>
                        </div>
                        <div class="flex items-center justify-between bg-gray-50 rounded-lg px-3 py-2">
                            <span class="text-gray-500">奖惩记录</span>
                            <span class="font-medium text-orange-500">1次警告</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 操作按钮 -->
            <div class="grid grid-cols-2 gap-3">
                <button class="action-btn bg-white border border-gray-200 text-gray-700 rounded-xl py-3 text-sm font-medium">
                    <i class="fas fa-map-marker-alt text-blue-500 mr-2"></i>查看位置
                </button>
                <button class="action-btn bg-blue-600 text-white rounded-xl py-3 text-sm font-medium">
                    <i class="fas fa-id-card mr-2"></i>完整档案
                </button>
            </div>
        </div>

        <!-- 最近查询 -->
        <div class="result-card rounded-xl p-4">
            <h3 class="text-sm font-semibold text-gray-800 mb-3">最近查询</h3>
            <div class="space-y-2">
                <a href="#" class="history-item flex items-center gap-3 p-2.5 rounded-lg">
                    <div class="w-10 h-10 rounded-lg bg-gray-100 flex items-center justify-center">
                        <i class="fas fa-user text-gray-400"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center gap-2">
                            <span class="text-sm font-medium text-gray-800">王某某</span>
                            <span class="tag tag-risk-low">低风险</span>
                        </div>
                        <p class="text-xs text-gray-400">编号 430100-0201 · 10分钟前</p>
                    </div>
                    <i class="fas fa-chevron-right text-gray-300 text-xs"></i>
                </a>
                <a href="#" class="history-item flex items-center gap-3 p-2.5 rounded-lg">
                    <div class="w-10 h-10 rounded-lg bg-gray-100 flex items-center justify-center">
                        <i class="fas fa-user text-gray-400"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center gap-2">
                            <span class="text-sm font-medium text-gray-800">周某某</span>
                            <span class="tag tag-risk-medium">中风险</span>
                        </div>
                        <p class="text-xs text-gray-400">编号 430100-0156 · 25分钟前</p>
                    </div>
                    <i class="fas fa-chevron-right text-gray-300 text-xs"></i>
                </a>
            </div>
        </div>
    </div>

    <!-- 底部Tab栏 -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex items-center justify-around py-2 safe-area-bottom">
        <a href="../../home.html" class="flex flex-col items-center py-1.5 px-4 text-gray-400">
            <div class="w-8 h-8 rounded-lg flex items-center justify-center"><i class="fas fa-home text-lg"></i></div>
            <span class="text-[11px] mt-1">首页</span>
        </a>
        <a href="../call/list.html" class="flex flex-col items-center py-1.5 px-4 text-gray-400">
            <div class="w-8 h-8 rounded-lg flex items-center justify-center"><i class="fas fa-clipboard-check text-lg"></i></div>
            <span class="text-[11px] mt-1">点名</span>
        </a>
        <a href="scan.html" class="tab-active flex flex-col items-center py-1.5 px-4 rounded-xl">
            <div class="w-8 h-8 rounded-lg bg-blue-50 flex items-center justify-center"><i class="fas fa-qrcode text-lg"></i></div>
            <span class="text-[11px] mt-1">扫码</span>
        </a>
        <a href="../flow/list.html" class="flex flex-col items-center py-1.5 px-4 text-gray-400">
            <div class="w-8 h-8 rounded-lg flex items-center justify-center"><i class="fas fa-person-walking-with-cane text-lg"></i></div>
            <span class="text-[11px] mt-1">流动</span>
        </a>
        <a href="../profile/index.html" class="flex flex-col items-center py-1.5 px-4 text-gray-400">
            <div class="w-8 h-8 rounded-lg flex items-center justify-center"><i class="fas fa-user text-lg"></i></div>
            <span class="text-[11px] mt-1">我的</span>
        </a>
    </nav>

    <!-- 手动输入弹窗 -->
    <div id="inputModal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-end">
        <div class="bg-white w-full rounded-t-3xl p-6 pb-8">
            <div class="w-12 h-1 bg-gray-300 rounded-full mx-auto mb-5"></div>
            <h3 class="text-base font-semibold text-gray-800 mb-4">手动输入编号</h3>
            <input type="text" class="w-full px-4 py-3.5 border border-gray-200 rounded-xl text-sm outline-none focus:border-blue-500 mb-4" placeholder="请输入罪犯编号">
            <button onclick="hideInput()" class="w-full bg-blue-600 text-white rounded-xl py-3.5 font-medium text-sm">查询</button>
            <button onclick="hideInput()" class="w-full text-gray-500 py-3 text-sm mt-1">取消</button>
        </div>
    </div>

    <script>
        function scanBarcode() { setTimeout(() => { document.getElementById('resultCard').classList.remove('hidden'); }, 600); }
        function scanFace() { setTimeout(() => { document.getElementById('resultCard').classList.remove('hidden'); }, 1000); }
        function inputId() { document.getElementById('inputModal').classList.remove('hidden'); }
        function hideInput() { document.getElementById('inputModal').classList.add('hidden'); }
    </script>
</body>
</html>
