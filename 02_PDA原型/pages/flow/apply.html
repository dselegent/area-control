<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>流动申请 - PDA手持终端</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #1a5276; --primary-light: #2874a6; }
        * { font-family: 'Noto Sans SC', -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #f1f5f9; }

        .nav-header { background: linear-gradient(145deg, #1a5276 0%, #2874a6 100%); }

        .form-card { background: #fff; border: 1px solid rgba(226,232,240,0.8); box-shadow: 0 2px 8px -2px rgba(0,0,0,0.06); }

        .type-card {
            border: 1.5px solid #e2e8f0;
            transition: all 0.2s;
        }
        .type-card.selected {
            border-color: var(--primary);
            background: rgba(26,82,118,0.08);
        }
        .type-card:active { transform: scale(0.97); }

        .type-icon { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; margin: 0 auto 8px; }
        .icon-med { background: #dbeafe; color: #1d4ed8; }
        .icon-meet { background: #dcfce7; color: #16a34a; }
        .icon-food { background: #fef3c7; color: #d97706; }
        .icon-study { background: #ede9fe; color: #7c3aed; }
        .icon-work { background: #ccfbf1; color: #0d9488; }
        .icon-other { background: #f1f5f9; color: #64748b; }

        .input-field {
            background: #f8fafc;
            border: 1.5px solid #e2e8f0;
            transition: all 0.2s;
        }
        .input-field:focus {
            background: #fff;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(26,82,118,0.1);
        }

        .duration-btn {
            border: 1.5px solid #e2e8f0;
            transition: all 0.2s;
            padding: 8px;
            text-align: center;
        }
        .duration-btn.active {
            border-color: var(--primary);
            background: rgba(26,82,118,0.08);
            color: var(--primary);
        }

        .action-btn { transition: all 0.2s; }
        .action-btn:active { transform: scale(0.97); }

        .person-item { transition: all 0.2s; background: #f8fafc; }
        .person-item:active { background: #f1f5f9; }

        .modal-card { background: #fff; border-radius: 24px 24px 0 0; }

        .safe-area-bottom { padding-bottom: env(safe-area-inset-bottom, 0px); }
    </style>
</head>
<body class="pb-6">
    <!-- 顶部导航 -->
    <div class="nav-header text-white px-4 py-3 flex items-center justify-between sticky top-0 z-30">
        <a href="#" onclick="handleBack(event)" class="text-white"><i class="fas fa-arrow-left text-lg"></i></a>
        <h1 class="text-base font-semibold">流动申请</h1>
        <button onclick="saveAsDraft()" class="text-xs text-white/80">存草稿</button>
    </div>

    <div class="p-4 space-y-4">
        <!-- 发起民警 -->
        <div class="form-card rounded-xl p-4">
            <h3 class="text-sm font-semibold text-gray-800 mb-3 flex items-center gap-1">
                <span class="text-red-500">*</span>发起民警
            </h3>
            <input type="text" class="input-field w-full px-4 py-3 rounded-xl text-sm outline-none" value="张警官" placeholder="请输入发起民警姓名">
        </div>

        <!-- 流动类型 -->
        <div class="form-card rounded-xl p-4">
            <h3 class="text-sm font-semibold text-gray-800 mb-3 flex items-center gap-1">
                <span class="text-red-500">*</span>流动类型
            </h3>
            <div class="grid grid-cols-3 gap-3">
                <button onclick="selectType(this)" class="type-card rounded-xl p-3 text-center">
                    <div class="type-icon icon-med"><i class="fas fa-hospital"></i></div>
                    <p class="text-xs text-gray-600">监内就医</p>
                </button>
                <button onclick="selectType(this)" class="type-card rounded-xl p-3 text-center">
                    <div class="type-icon icon-meet"><i class="fas fa-users"></i></div>
                    <p class="text-xs text-gray-600">会见</p>
                </button>
                <button onclick="selectType(this)" class="type-card rounded-xl p-3 text-center">
                    <div class="type-icon icon-food"><i class="fas fa-utensils"></i></div>
                    <p class="text-xs text-gray-600">送餐送货</p>
                </button>
                <button onclick="selectType(this)" class="type-card rounded-xl p-3 text-center">
                    <div class="type-icon icon-study"><i class="fas fa-book"></i></div>
                    <p class="text-xs text-gray-600">教育学习</p>
                </button>
                <button onclick="selectType(this)" class="type-card rounded-xl p-3 text-center">
                    <div class="type-icon icon-work"><i class="fas fa-broom"></i></div>
                    <p class="text-xs text-gray-600">劳动改造</p>
                </button>
                <button onclick="selectType(this)" class="type-card rounded-xl p-3 text-center">
                    <div class="type-icon icon-other"><i class="fas fa-ellipsis-h"></i></div>
                    <p class="text-xs text-gray-600">其他</p>
                </button>
            </div>
        </div>

        <!-- 人员选择 -->
        <div class="form-card rounded-xl p-4">
            <div class="flex items-center justify-between mb-3">
                <h3 class="text-sm font-semibold text-gray-800 flex items-center gap-1">
                    <span class="text-red-500">*</span>流动人员
                </h3>
                <span class="text-xs text-gray-400">已选 <b class="text-blue-600" id="personCount">0</b>/10人</span>
            </div>
            <div id="personList" class="space-y-2 mb-3"></div>
            <div class="grid grid-cols-2 gap-3">
                <button onclick="scanAddPerson()" class="action-btn bg-blue-50 text-blue-600 rounded-xl py-3 text-sm font-medium flex items-center justify-center gap-2">
                    <i class="fas fa-user"></i><span>人脸添加</span>
                </button>
                <button onclick="showPersonSelect()" class="action-btn bg-gray-100 text-gray-600 rounded-xl py-3 text-sm font-medium flex items-center justify-center gap-2">
                    <i class="fas fa-list"></i><span>手动选择</span>
                </button>
            </div>
        </div>

        <!-- 目标区域 -->
        <div class="form-card rounded-xl p-4">
            <h3 class="text-sm font-semibold text-gray-800 mb-3 flex items-center gap-1">
                <span class="text-red-500">*</span>目标区域
            </h3>
            <select class="input-field w-full px-4 py-3 rounded-xl text-sm outline-none">
                <option value="">请选择目标区域</option>
                <option>医疗监区</option>
                <option>会见楼</option>
                <option>食堂</option>
                <option>教学楼</option>
                <option>劳动车间</option>
                <option>严管区</option>
            </select>
        </div>

        <!-- 事由 -->
        <div class="form-card rounded-xl p-4">
            <h3 class="text-sm font-semibold text-gray-800 mb-3 flex items-center gap-1">
                <span class="text-red-500">*</span>流动事由
            </h3>
            <textarea class="input-field w-full px-4 py-3 rounded-xl text-sm outline-none resize-none" rows="3" placeholder="请输入流动事由"></textarea>
        </div>

        <!-- 预计时长 -->
        <div class="form-card rounded-xl p-4">
            <h3 class="text-sm font-semibold text-gray-800 mb-3">预计时长</h3>
            <div class="grid grid-cols-4 gap-2">
                <button onclick="selectDuration(this, 30)" class="duration-btn rounded-lg text-xs text-gray-600">30分钟</button>
                <button onclick="selectDuration(this, 60)" class="duration-btn active rounded-lg text-xs">1小时</button>
                <button onclick="selectDuration(this, 120)" class="duration-btn rounded-lg text-xs text-gray-600">2小时</button>
                <button onclick="selectDuration(this, 0)" class="duration-btn rounded-lg text-xs text-gray-600">不限</button>
            </div>
        </div>

        <!-- 加急选项 -->
        <div class="form-card rounded-xl p-4">
            <label class="flex items-center justify-between cursor-pointer">
                <div>
                    <p class="text-sm font-medium text-gray-800">加急申请</p>
                    <p class="text-xs text-gray-400 mt-1">审批时限缩短至30分钟</p>
                </div>
                <div class="w-11 h-6 bg-gray-200 rounded-full relative">
                    <div class="absolute right-0.5 top-0.5 w-5 h-5 bg-white rounded-full shadow"></div>
                </div>
            </label>
        </div>

        <!-- 提交按钮 -->
        <div class="flex gap-3">
            <button class="flex-1 action-btn bg-gray-100 text-gray-600 rounded-xl py-3.5 text-sm font-medium">存为草稿</button>
            <button onclick="submitApply()" class="flex-1 action-btn bg-blue-600 text-white rounded-xl py-3.5 text-sm font-medium">
                <i class="fas fa-paper-plane mr-2"></i>提交申请
            </button>
        </div>
    </div>

    <!-- 人员选择弹窗 -->
    <div id="personModal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-end">
        <div class="modal-card w-full p-6 pb-8 max-h-[70vh] flex flex-col">
            <div class="w-12 h-1 bg-gray-300 rounded-full mx-auto mb-5"></div>
            <h3 class="text-base font-semibold text-gray-800 mb-3">选择流动人员</h3>
            <input type="text" class="input-field w-full px-4 py-3 rounded-xl text-sm outline-none mb-3" placeholder="搜索姓名或编号">
            <div class="flex-1 overflow-y-auto space-y-2">
                <label class="flex items-center gap-3 p-3 rounded-xl person-item cursor-pointer">
                    <input type="checkbox" class="w-4 h-4 text-blue-600 rounded">
                    <div class="w-10 h-10 rounded-xl bg-gray-100 flex items-center justify-center"><i class="fas fa-user text-gray-400"></i></div>
                    <div><p class="text-sm font-medium text-gray-800">张某某</p><p class="text-xs text-gray-400">430100-0105</p></div>
                </label>
                <label class="flex items-center gap-3 p-3 rounded-xl person-item cursor-pointer">
                    <input type="checkbox" class="w-4 h-4 text-blue-600 rounded">
                    <div class="w-10 h-10 rounded-xl bg-gray-100 flex items-center justify-center"><i class="fas fa-user text-gray-400"></i></div>
                    <div><p class="text-sm font-medium text-gray-800">刘某某</p><p class="text-xs text-gray-400">430100-0112</p></div>
                </label>
                <label class="flex items-center gap-3 p-3 rounded-xl person-item cursor-pointer">
                    <input type="checkbox" class="w-4 h-4 text-blue-600 rounded">
                    <div class="w-10 h-10 rounded-xl bg-gray-100 flex items-center justify-center"><i class="fas fa-user text-gray-400"></i></div>
                    <div><p class="text-sm font-medium text-gray-800">王某某</p><p class="text-xs text-gray-400">430100-0201</p></div>
                </label>
            </div>
            <button onclick="hidePersonSelect()" class="action-btn w-full bg-blue-600 text-white rounded-xl py-3.5 text-sm font-medium mt-4">确认选择</button>
        </div>
    </div>

    <script>
        function selectType(el) {
            document.querySelectorAll('.type-card').forEach(c => c.classList.remove('selected'));
            el.classList.add('selected');
        }
        let personCount = 0;

        // 页面加载时检查是否有人脸扫描返回的人员
        document.addEventListener('DOMContentLoaded', function() {
            const savedPersons = localStorage.getItem('flowPersons');
            if (savedPersons) {
                const persons = JSON.parse(savedPersons);
                persons.forEach(p => addPersonToList(p.name, p.id));
                localStorage.removeItem('flowPersons');
            }
        });
        function scanAddPerson() {
            // 检查是否从人脸扫描页面返回
            const savedPersons = localStorage.getItem('flowPersons');
            if (savedPersons) {
                const persons = JSON.parse(savedPersons);
                if (persons.length > personCount) {
                    const newPerson = persons[personCount];
                    addPersonToList(newPerson.name, newPerson.id);
                    localStorage.removeItem('flowPersons');
                }
            } else {
                // 跳转到人脸扫描页面
                window.location.href = 'face-scan.html';
            }
        }
        function addPersonToList(name, id) {
            const list = document.getElementById('personList');
            list.innerHTML += `<div class="flex items-center gap-3 p-2.5 bg-blue-50 rounded-lg"><div class="w-8 h-8 rounded-lg bg-gray-200 flex items-center justify-center"><i class="fas fa-user text-gray-400 text-xs"></i></div><div class="flex-1"><p class="text-sm font-medium text-gray-800">${name}</p><p class="text-xs text-gray-400">${id}</p></div><button onclick="this.parentElement.remove(); personCount--; document.getElementById('personCount').textContent=personCount;" class="text-gray-400"><i class="fas fa-times"></i></button></div>`;
            personCount++;
            document.getElementById('personCount').textContent = personCount;
        }
        function showPersonSelect() { document.getElementById('personModal').classList.remove('hidden'); }
        function hidePersonSelect() { document.getElementById('personModal').classList.add('hidden'); }
        function selectDuration(el, min) {
            document.querySelectorAll('.duration-btn').forEach(b => { b.classList.remove('active', 'text-blue-600'); b.classList.add('text-gray-600'); });
            el.classList.add('active');
        }
        function submitApply() {
            if (personCount === 0) { alert('请添加流动人员'); return; }
            alert('流动申请已提交，等待审批中...');
            // 跳转到流动记录页面
            window.location.href = 'list.html';
        }

        // 返回时询问是否存草稿
        function handleBack(e) {
            e.preventDefault();
            const inputs = document.querySelectorAll('input, textarea, select');
            let hasContent = false;
            inputs.forEach(input => {
                if (input.value && input.value.trim()) hasContent = true;
            });
            if (hasContent || personCount > 0) {
                document.getElementById('backModal').classList.remove('hidden');
            } else {
                window.location.href = '../../home.html';
            }
        }

        function closeBackModal() {
            document.getElementById('backModal').classList.add('hidden');
        }

        function saveDraftAndGoBack() {
            alert('已保存为草稿');
            closeBackModal();
            window.location.href = 'list.html';
        }

        function discardAndGoBack() {
            window.location.href = '../../home.html';
        }

        function saveAsDraft() {
            alert('已保存为草稿');
            window.location.href = 'list.html';
        }

        // 返回确认弹窗
    </script>

    <!-- 返回确认弹窗 -->
    <div id="backModal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-6">
        <div class="bg-white rounded-2xl p-5 w-full max-w-sm">
            <div class="text-center mb-4">
                <div class="w-14 h-14 mx-auto rounded-full bg-blue-100 flex items-center justify-center mb-3">
                    <i class="fas fa-file-import text-blue-600 text-2xl"></i>
                </div>
                <h3 class="text-base font-semibold text-gray-800">是否保存为草稿？</h3>
                <p class="text-sm text-gray-500 mt-1">您填写的内容将保存为草稿，下次可继续编辑</p>
            </div>
            <div class="space-y-2">
                <button onclick="saveDraftAndGoBack()" class="w-full bg-blue-600 text-white rounded-xl py-3 text-sm font-medium">保存并退出</button>
                <button onclick="discardAndGoBack()" class="w-full bg-gray-100 text-gray-600 rounded-xl py-3 text-sm font-medium">不保存</button>
                <button onclick="closeBackModal()" class="w-full text-gray-400 py-2 text-sm">取消</button>
            </div>
        </div>
    </div>
</body>
</html>
